# Fuentes de las listas de NoMore.
#
# Añadir o quitar una fuente se decide con Michell (ver SPEC-blocklists.md).
# `min_domains` es la mitad aproximada del tamaño actual: por debajo, la
# descarga se considera rota y se usa la copia del día anterior.

[categories.porn]
# Dominios de primer nivel dedicados a contenido adulto: se bloquean enteros.
tlds = ["xxx", "porn", "adult", "sex"]

