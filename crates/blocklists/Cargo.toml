[package]
name = "blocklists"
version = "0.1.0"
description = "Verificador de las listas de NoMore: firma, versión y diferencias"
edition.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
filter-core = { path = "../filter-core" }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
proptest = "1"
