[package]
name = "guard-core"
version = "0.1.0"
description = "Anti-manipulación de NoMore: autorizaciones, guardianes, registro de eventos y avisos"
edition.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
proptest = "1"
